name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No LangSmith key, no model key: everything below runs offline with the fake model.
env:
  LANGSMITH_TRACING: "false"
  LANGSMITH_TEST_TRACKING: "false"

jobs:
  lint:
    name: Lint (ruff + mypy + bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-interaction --all-extras
      - name: ruff check
        run: poetry run ruff check langsmith_agent_evals tests examples
      - name: ruff format --check
        run: poetry run ruff format --check langsmith_agent_evals tests examples
      - name: mypy
        run: poetry run mypy langsmith_agent_evals
      - name: bandit
        run: poetry run bandit -c pyproject.toml -q -r langsmith_agent_evals

  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-interaction --no-root --all-extras
      - name: pip-audit
        run: |
          # pip is tooling, not a shipped dependency: upgrade it so its own advisories don't fail the audit.
          poetry run python -m pip install --upgrade -q pip
          poetry run pip-audit

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Run pytest (fake model, sockets blocked)
        run: poetry run pytest -q
      - name: Bundled database matches its JSON source
        run: poetry run python -m langsmith_agent_evals.data --check
      - name: Quickstart example (offline)
        run: poetry run python -m examples.quickstart

  evals:
    name: Evaluation + regression gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Experiments v1 vs v2 (langsmith.evaluate, upload_results=False)
        run: poetry run python -m langsmith_agent_evals.evals --provider fake run --prompts v1 v2 --out runs/ci | tee run.txt
      - name: Regression gate on the shipped prompt
        run: poetry run python -m langsmith_agent_evals.evals --provider fake gate --prompt v2
      - name: The gate must fail on the degraded prompt
        run: |
          if poetry run python -m langsmith_agent_evals.evals --provider fake gate --prompt degraded; then
            echo "gate passed a degraded prompt"; exit 1
          fi
      - name: Online evaluation over the captured traces
        run: poetry run python -m langsmith_agent_evals.evals --provider fake online --traces runs/ci/traces.jsonl --rate 0.5 --out runs/ci/online.jsonl
      - name: Upload path refuses without a key and opt-in
        run: |
          if poetry run python -m langsmith_agent_evals.evals upload; then exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: runs/ci/
          retention-days: 14
