[tool.poetry]
name = "langsmith-agent-evals"
version = "0.1.0"
description = "Evaluation and observability for a LangGraph agent with the LangSmith SDK, run 100% offline: golden datasets, evaluate()/aevaluate() with correctness, agentevals trajectory matching, an openevals LLM-as-judge critic on a local model, latency/token/cost summaries, pairwise A/B of prompt versions, a CI regression gate, local JSONL traces and an HTML report."
authors = ["Martín Castro Álvarez <martincastro.10.5@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/MartinCastroAlvarez/langsmith-agent-evals"
repository = "https://github.com/MartinCastroAlvarez/langsmith-agent-evals"
documentation = "https://github.com/MartinCastroAlvarez/langsmith-agent-evals#readme"
keywords = [
    "langsmith",
    "langgraph",
    "llm-evaluation",
    "agent-evaluation",
    "llm-as-judge",
    "trajectory-evaluation",
    "openevals",
    "agentevals",
    "observability",
    "ollama",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
packages = [{ include = "langsmith_agent_evals" }]
include = [
    { path = "LICENSE", format = ["sdist", "wheel"] },
]

[tool.poetry.scripts]
support-agent = "langsmith_agent_evals.cli:main"
agent-evals = "langsmith_agent_evals.evals:main"

[tool.poetry.dependencies]
python = "^3.11"
langsmith = ">=0.14.12,<0.15"
openevals = ">=0.2.2,<0.3"
agentevals = ">=0.0.9,<0.1"
langgraph = ">=1.2.17,<2"
langchain = ">=1.4.7,<2"
langchain-core = ">=1.7,<2"
langchain-ollama = ">=1.1,<2"
pydantic = ">=2.10,<3"
langchain-anthropic = { version = ">=1.7,<2", optional = true }

[tool.poetry.extras]
anthropic = ["langchain-anthropic"]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-cov = ">=5,<8"
ruff = ">=0.6"
mypy = "^1.11 || ^2.0"
bandit = "^1.7"
pip-audit = "^2.7"

[build-system]
requires = ["poetry-core>=1.6.0"]
build-backend = "poetry.core.masonry.api"

# --------------------------------------------------------------------------- #
# Ruff - lint + format
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",       # pycodestyle
    "F",            # pyflakes
    "I",            # isort
    "B",            # bugbear
    "S",            # bandit-style security
    "UP",           # pyupgrade
    "SIM",          # simplify
    "RET",          # returns
    "PIE",          # misc
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106", "E501", "E402"]
"examples/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["langsmith_agent_evals", "tests", "examples"]

# --------------------------------------------------------------------------- #
# Pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
python_files = ["test_*.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=langsmith_agent_evals",
    "--cov-report=term-missing",
]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore:'upload_results' parameter is in beta",
    "ignore::langsmith.utils.LangSmithMissingAPIKeyWarning",
    "ignore:ast.Str is deprecated:DeprecationWarning:langsmith",
]

# --------------------------------------------------------------------------- #
# MyPy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["agentevals.*", "openevals.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
# Coverage
# --------------------------------------------------------------------------- #
[tool.coverage.run]
branch = true
source = ["langsmith_agent_evals"]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
omit = [
    "langsmith_agent_evals/__main__.py",
]

# --------------------------------------------------------------------------- #
# Bandit
# --------------------------------------------------------------------------- #
[tool.bandit]
exclude_dirs = ["tests", "examples", ".venv", "build", "dist"]
